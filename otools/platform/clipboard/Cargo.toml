[package]
name = "otools-platform-clipboard"
version = "0.1.0"
edition = "2021"

[dependencies]
arboard = "3.6"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "ico"] }
mime_guess = "2.0.5"
serde = { version = "1", features = ["derive"] }
