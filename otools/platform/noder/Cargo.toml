[package]
name = "otools-platform-noder"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
dirs = "6"
http = "1"
lazy_static = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }
