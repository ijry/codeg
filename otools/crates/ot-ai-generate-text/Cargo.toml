[package]
name = "ot-ai-generate-text"
version = "0.1.0"
edition = "2021"
description = "Compatibility shim for legacy OTools AI text generation"

[dependencies]
async-openai = "0.28"
futures = "0.3"
lazy_static = "1.4"
otools-ai = { path = "../../ai" }
otools-core = { path = "../../core" }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
