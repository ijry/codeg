[package]
name = "otools-plugin-dev"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
otools-core = { path = "../../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zip = "2"
