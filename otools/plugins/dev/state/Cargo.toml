[package]
name = "otools-plugin-dev-state"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
otools-core = { path = "../../../core" }
otools-plugin-dev-model = { path = "../model" }
otools-plugin-support = { path = "../../support" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
