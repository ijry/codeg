[package]
name = "otools-ai"
version = "0.1.0"
edition = "2021"

[dependencies]
async-openai = "0.28"
chrono = { version = "0.4", features = ["clock"] }
otools-core = { path = "../core" }
otools-plugin-config = { path = "../plugins/config/host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
