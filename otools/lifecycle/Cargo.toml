[package]
name = "otools-lifecycle"
version = "0.1.0"
edition = "2021"

[dependencies]
otools-core = { path = "../core" }
otools-platform-lifecycle-registry = { path = "../platform/lifecycle-registry" }
otools-plugin-dispatcher = { path = "../plugins/dispatcher" }
otools-plugin-registry = { path = "../plugins/registry" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "sync"] }
